<title>OPIc 스크립트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Batang:wght@700&display=swap">
<style>
/* 한 열 도구: 맨 위에 "다음에 채울 것", 아래에 주제 목록, 주제를 열면 이야기와 답변 틀 */
:root{
  --bg:#eef1ee; --card:#f8faf8; --ink:#25303a; --mute:#5d6a74; --line:#cfd7d2; --soft:#e2e8e4;
  --accent:#1f6f6b; --accent-ink:#ffffff; --accent-soft:#d3e6e3; --ok:#2f7d4f; --warn:#9a6a14; --bad:#a23b3b; --warn-soft:#efe3c8;
  --f-head:"Gowun Batang",Georgia,serif; --f-body:"IBM Plex Sans KR",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171d21; --card:#1f272c; --ink:#e3e8e5; --mute:#97a4ab; --line:#33403f; --soft:#29343a;
  --accent:#4fb3ac; --accent-ink:#0f1a1a; --accent-soft:#25403f; --ok:#6ec58f; --warn:#d9a94a; --bad:#e08585; --warn-soft:#3b3320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171d21; --card:#1f272c; --ink:#e3e8e5; --mute:#97a4ab; --line:#33403f; --soft:#29343a;
  --accent:#4fb3ac; --accent-ink:#0f1a1a; --accent-soft:#25403f; --ok:#6ec58f; --warn:#d9a94a; --bad:#e08585; --warn-soft:#3b3320; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);padding-inline:16px;padding-block:20px}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:700 26px/1.3 var(--f-head);margin:0;text-wrap:balance}
h2{font:600 16px/1.4 var(--f-body);margin:0}
h3{font:600 14px/1.4 var(--f-body);margin:0}
p{margin:0}
.mute{color:var(--mute)} .small{font-size:13px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status{font:12px var(--f-mono);color:var(--mute)}
.status.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.next{border-color:var(--accent);border-width:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
button,select,textarea,input{font:inherit;color:var(--ink)}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:7px 13px;cursor:pointer;font-weight:500}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.link{background:none;border:0;color:var(--mute);padding:2px 4px;font-weight:400;text-decoration:underline}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.topic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,textarea,input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;box-sizing:border-box;max-width:100%}
textarea,input[type=text]{width:100%}
textarea{resize:vertical;line-height:1.55}
.topic{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;min-width:0}
.topic:hover{border-color:var(--accent)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.chip.s1{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.s2{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.star{font-size:18px;line-height:1;background:none;border:0;color:var(--mute);padding:2px 4px}
.star.on{color:var(--warn)}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--mute)}
.pill.sens{background:var(--warn-soft);color:var(--warn)}
.en{font:15px/1.7 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere}
.expr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 12px;font-size:14px}
.expr b{font-weight:500}
.tip{font-size:13px;color:var(--mute);border-left:3px solid var(--accent-soft);padding-left:10px}
.q{font-weight:500}
.msg{font-size:13px;padding:8px 12px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.nums{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.nums span b{font:500 20px var(--f-mono);margin-right:4px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
@media(max-width:480px){.expr{grid-template-columns:1fr}}
</style>
<div id="app"><p class="mute">불러오는 중…</p></div>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function cut(s,n){s=String(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n-1)+"…":s}

/* ---------- 데이터 틀 ---------- */
var KINDS=[["desc","묘사"],["habit","습관·경향"],["past","과거 경험"],["change","변화·비교"],["role","롤플레이"]];
var KIND={};KINDS.forEach(function(k){KIND[k[0]]=k[1]});
var KIND_ASK={
  desc:"장소·사람·물건을 눈앞에 그리듯 설명하게 하는 질문",
  habit:"평소 어떻게, 얼마나 자주, 누구와 하는지 묻는 질문",
  past:"기억에 남는 한 번의 일(언제·어디서·누구와·무슨 일·어떻게 끝났고 어떤 느낌)을 묻는 질문",
  change:"예전과 지금이 어떻게 달라졌는지 묻는 질문",
  role:"일이나 생활에서 예상 밖 문제가 생긴 상황을 떠올리게 하는 질문"
};
var KIND_FALLBACK={
  desc:"[{t}] 눈앞에 그려지도록 설명해 보세요. 어디에서, 어떤 모습인가요?",
  habit:"[{t}] 평소 어떻게 하는지 알려 주세요. 얼마나 자주, 누구와 하나요?",
  past:"[{t}] 기억에 남는 일 하나를 떠올려 주세요. 언제, 어디서, 무슨 일이 있었고 어떻게 끝났나요?",
  change:"[{t}] 예전과 지금이 어떻게 달라졌나요?",
  role:"[{t}] 예상 밖 문제가 생겼던 상황이 있나요? 어떻게 해결했나요?"
};
var TOPICS=[
 {id:"intro",name:"자기소개",need:["desc","past","change"]},
 {id:"home",name:"집"},
 {id:"work",name:"직장",need:["desc","habit","past","change","role"]},
 {id:"english",name:"영어 경험"},
 {id:"music",name:"음악"},
 {id:"media",name:"영화·콘텐츠"},
 {id:"family",name:"가족"},
 {id:"school",name:"학창 시절"},
 {id:"college",name:"대학·군대"},
 {id:"venture",name:"사업·도전"},
 {id:"club",name:"취미·동아리"},
 {id:"sports",name:"운동"},
 {id:"travel",name:"여행"},
 {id:"routine",name:"일상·출퇴근"},
 {id:"roleplay",name:"롤플레이 상황",need:["role"]}
];
var DEF_NEED=["desc","habit","past","change"];

/* ---------- 호스트 연결 (저장·AI·파일) ---------- */
var B={kind:"local",uid:"local",db:null,sample:null,dl:null};
function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}
B.init=function(){
  var c=window.claude;
  if(!c||typeof c.use!=="function")return Promise.resolve();
  function use(n){return withTimeout(c.use(n).catch(function(){return null}),12000)}
  return Promise.all([use("db"),use("user"),use("sample"),use("downloads")]).then(function(r){
    B.db=r[0];B.sample=r[2];B.dl=r[3];
    if(r[1]){return r[1].id().then(function(id){B.uid=id}).catch(function(){B.uid=null})}
  }).then(function(){B.kind=B.db&&B.uid&&B.uid!=="local"?"cloud":"local";if(B.kind==="local")B.uid="local"});
};
B.base=function(){return "data/users/"+B.uid};
B.loadAll=function(){
  if(B.kind==="local"){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("opic.")===0)o[k.slice(5)]=JSON.parse(localStorage.getItem(k))}}catch(e){}return Promise.resolve(o)}
  return B.db.collection(B.base()).get().then(function(snap){var o={};snap.docs.forEach(function(d){if(d.exists)o[d.id]=clone(d.data())});return o});
};
B.save=function(name,data){
  if(B.kind==="local"){try{localStorage.setItem("opic."+name,JSON.stringify(data))}catch(e){return Promise.reject(e)}return Promise.resolve()}
  return B.db.doc(B.base()+"/"+name).set(data);
};

/* ---------- 상태·저장 ---------- */
var S={docs:{},view:"home",busy:"",msg:"",msgBad:false,save:"",draft:{},form:{kind:"past",title:"",text:"",sens:false},edit:"",exp:{stories:true,sens:false},askKind:"past"};
var chain={};
function persist(name){
  var data=clone(S.docs[name]);
  S.save="저장 중…";paintStatus();
  chain[name]=(chain[name]||Promise.resolve()).then(function(){return B.save(name,data)}).then(function(){S.save="저장됨";S.saveBad=false;paintStatus()}).catch(function(e){S.save="저장 실패: "+((e&&e.code)||(e&&e.message)||"알 수 없음");S.saveBad=true;paintStatus()});
}
function paintStatus(){var el=$("#status");if(el){el.textContent=(B.kind==="cloud"?"계정에 저장":"이 브라우저에만 저장")+(S.save?" · "+S.save:"");el.className="status"+(S.saveBad?" bad":"")}}
function meta(){var m=S.docs.meta;if(!m)m=S.docs.meta={focus:[],custom:[],about:""};if(!m.focus)m.focus=[];if(!m.custom)m.custom=[];return m}
function tdoc(id){var k="st_"+id;if(!S.docs[k])S.docs[k]={stories:[],frames:[]};var d=S.docs[k];if(!d.stories)d.stories=[];if(!d.frames)d.frames=[];return d}
function topics(){return TOPICS.concat(meta().custom.map(function(c){return {id:c.id,name:c.name,custom:true}}))}
function topicBy(id){return topics().filter(function(t){return t.id===id})[0]}
function need(t){return t.need||DEF_NEED}
function kindState(t,k){var d=tdoc(t.id);if(d.frames.some(function(f){return f.kind===k}))return 2;if(d.stories.some(function(s){return s.kind===k}))return 1;return 0}
function fill(t){var n=need(t);return n.reduce(function(a,k){return a+kindState(t,k)/2},0)/n.length}
function isFocus(id){return meta().focus.indexOf(id)>=0}

/* 다음에 채울 것: 시험 주제로 고른 것 먼저, 그다음 채움이 낮은 순 */
function pickNext(){
  var list=topics().map(function(t,i){return {t:t,i:i,f:fill(t)}}).filter(function(x){return x.f<1});
  list.sort(function(a,b){var fa=isFocus(a.t.id)?0:1,fb=isFocus(b.t.id)?0:1;return fa-fb||a.f-b.f||a.i-b.i});
  if(!list.length)return null;
  var t=list[0].t,kinds=need(t);
  var k=kinds.filter(function(k){return kindState(t,k)===0})[0];
  if(k)return {t:t,kind:k,mode:"ask"};
  k=kinds.filter(function(k){return kindState(t,k)===1})[0];
  return {t:t,kind:k,mode:"build"};
}

/* ---------- AI ---------- */
function aiErr(e){
  var c=e&&e.code;
  if(c==="no_sample"||c==="unavailable")return "이 환경에서는 AI를 쓸 수 없습니다. 직접 입력은 됩니다.";
  if(c==="not_granted")return "AI 사용을 허용해야 합니다. 허용 창에서 승인해 주세요.";
  if(c==="rate_limited")return "요청이 몰렸습니다. 잠시 뒤에 다시 눌러 주세요.";
  return "AI 오류 ("+(c||"알 수 없음")+") "+cut(e&&e.message,80);
}
function ai(prompt,tier){
  if(!B.sample)return Promise.reject({code:"no_sample"});
  return B.sample.json(prompt,{modelTier:tier||"default",cache:false});
}
function storyLines(t,kind,max){
  var d=tdoc(t.id);
  return d.stories.filter(function(s){return !kind||s.kind===kind}).slice(0,max||6).map(function(s){return "- "+(s.title?s.title+": ":"")+cut(s.text,500)}).join("\n");
}
function askQuestion(t,kind){
  var done=tdoc(t.id).stories.slice(0,8).map(function(s){return "- "+(s.title||cut(s.text,50))}).join("\n")||"(아직 없음)";
  var p="OPIc 연습 앱에서 소유자에게 한국어로 던질 질문을 하나 만드세요.\n"
   +"주제: "+t.name+"\n질문 유형: "+KIND[kind]+" — "+KIND_ASK[kind]+"\n"
   +(meta().about?"소유자 정보: "+meta().about+"\n":"")
   +"이미 모은 이야기:\n"+done+"\n"
   +"규칙: 이미 모은 이야기와 겹치지 않게 하고, 구체적인 장면·숫자·감정이 나오도록 묻는다. 존댓말 두 문장 이내, 번역투 금지.\n"
   +"JSON만 출력: {\"q\":\"질문\"}";
  return ai(p,"quick").then(function(r){var q=r&&r.q;if(!q)throw {code:"invalid_json"};return String(q)});
}
function buildFrame(t,kind,storyIds){
  var d=tdoc(t.id);
  var ss=d.stories.filter(function(s){return storyIds?storyIds.indexOf(s.id)>=0:s.kind===kind});
  if(!ss.length)return Promise.reject({code:"no_story",message:"먼저 이 유형의 이야기를 하나 적어 주세요."});
  var mat=ss.slice(0,3).map(function(s){return "- "+(s.title?s.title+": ":"")+cut(s.text,1500)}).join("\n");
  var rp=kind==="role",lv=meta().level==="IH"?"IH":"AL";
  var LV={
   IH:{name:"IH(Intermediate High)",len:"120~170단어",voc:"어려운 어휘는 피하고 답변자가 실제로 입에 올릴 만한 수준(B1~B2)으로 쓴다.",skill:"문장을 넘어 문단으로 이어 말하고 과거·현재·미래를 오간다."},
   AL:{name:"AL(Advanced Low)",len:"170~230단어",voc:"어휘는 B2~C1이되 말로 하기 어려운 단어는 피하고, 일상 관용 표현을 한두 개 넣는다. 접속 구조를 다양하게 쓴다(although, which meant, by the time, I had pp 같은 과거완료, if it hadn't been for 등).",skill:"문단 단위로 서사와 묘사를 과거·현재·미래 모두에서 막힘없이 통제한다. 예상 밖 상황(complication)이 생긴 경위와 해결을 구체적 세부와 함께 말하고, 이유·결과·비교를 붙이며, 마무리에서 한 문장 정도 일반화된 의견이나 배운 점을 말한다."}
  }[lv];
  var p="OPIc(ACTFL) 답변 틀을 만드세요. 목표 등급은 "+LV.name+"입니다. "+LV.skill+"\n"
   +(meta().about?"답변자: "+meta().about+"\n":"")
   +"주제: "+t.name+"\n질문 유형: "+KIND[kind]+"\n이야기 재료(한국어):\n"+mat+"\n\n"
   +"요구:\n"
   +"1) q: 시험관이 실제로 할 법한 영어 질문 1개."+(rp?" 롤플레이이므로 상황 설명과 할 일, 중간에 생기는 예상 밖 문제(complication) 처리까지 포함한다.":"")+"\n"
   +"2) en: 영어 답변 "+LV.len+". 말로 하는 자연스러운 영어. 도입 → 묘사 → 구체적 사건(순서, 숫자, 대화나 반응) → 느낌 → 마무리로 문단을 이어 간다. "+(kind==="past"?"과거 시제 중심에 현재·미래로 마무리한다.":"과거·현재·미래 시제를 상황에 맞게 오간다.")+" "+LV.voc+" 읽는 듯한 문어체와 외운 티가 나는 문장은 금지한다.\n"
   +"3) expr: 이 답변에서 뽑은, 다른 주제에도 다시 쓸 수 있는 핵심 표현 6~8개. [{\"en\":\"\",\"ko\":\"\"}]\n"
   +"4) tip: 한국어 한 줄. 이 답을 말할 때 주의할 시제나 구조.\n"
   +"이야기에 없는 사실은 지어내지 말고, 모자라면 일반적인 표현으로 둔다.\n"
   +"JSON만 출력: {\"q\":\"\",\"en\":\"\",\"expr\":[{\"en\":\"\",\"ko\":\"\"}],\"tip\":\"\"}";
  return ai(p,"default").then(function(r){
    if(!r||!r.en)throw {code:"invalid_json"};
    var f={id:nid(),kind:kind,q:String(r.q||""),en:String(r.en),expr:(r.expr||[]).filter(function(x){return x&&x.en}).map(function(x){return {en:String(x.en),ko:String(x.ko||"")}}),tip:String(r.tip||""),level:lv,srcs:ss.slice(0,3).map(function(s){return s.id}),at:new Date().toISOString()};
    d.frames.unshift(f);persist("st_"+t.id);return f;
  });
}

/* ---------- 화면 ---------- */
function kindChips(t){
  return need(t).map(function(k){var s=kindState(t,k);return '<span class="chip s'+s+'" title="'+(s===2?"답변 틀 있음":s===1?"이야기만 있음":"비어 있음")+'">'+KIND[k]+(s===2?" ✓":s===1?" ·":"")+'</span>'}).join("");
}
function counts(){var st=0,fr=0,tot=0,ts=topics();ts.forEach(function(t){var d=tdoc(t.id);st+=d.stories.length;fr+=d.frames.length;tot+=fill(t)});return {st:st,fr:fr,pct:ts.length?Math.round(tot/ts.length*100):0}}
function kindOpts(sel,list){return (list||KINDS.map(function(k){return k[0]})).map(function(k){return '<option value="'+k+'"'+(k===sel?" selected":"")+'>'+KIND[k]+'</option>'}).join("")}
function msgHtml(){return S.msg?'<div class="msg'+(S.msgBad?" bad":"")+'" role="status">'+esc(S.msg)+'</div>':""}

function nextCard(){
  var n=pickNext();
  if(!n)return '<section class="card"><h2>모든 주제를 채웠습니다</h2><p class="mute small">주제를 열어 이야기를 더하거나, 새 주제를 추가해 보세요.</p></section>';
  var t=n.t,k=n.kind,b=S.busy;
  var h='<section class="card next"><div class="row between"><h2>다음에 채울 것</h2><span class="pill">'+esc(t.name)+' · '+KIND[k]+'</span></div>';
  if(n.mode==="ask"){
    var q=(S.draft.topic===t.id&&S.draft.kind===k&&S.draft.q)||KIND_FALLBACK[k].replace("{t}",t.name);
    h+='<p class="q">'+esc(q)+'</p>'
     +'<textarea id="dr-text" rows="5" placeholder="한국어로 편하게 적어 주세요. 장면, 숫자, 그때의 느낌이 있으면 좋습니다." data-bind="draft.text">'+esc(S.draft.topic===t.id&&S.draft.kind===k?S.draft.text||"":"")+'</textarea>'
     +'<div class="row"><button data-act="nextSave">이야기로 저장</button><button class="ghost" data-act="nextAsk"'+(b?" disabled":"")+'>'+(b==="ask"?"질문 만드는 중…":"다른 질문 받기")+'</button>'
     +'</div>';
  }else{
    h+='<p class="q">'+KIND[k]+' 이야기는 모였습니다. 영어 답변 틀로 만들어 볼까요?</p>'
     +'<p class="mute small">'+esc(cut(storyLines(t,k,2),240))+'</p>'
     +'<div class="row"><button data-act="nextBuild"'+(b?" disabled":"")+'>'+(b==="build"?"영어 틀 만드는 중…":"영어 답변 틀 만들기")+'</button></div>';
  }
  return h+'</section>';
}
function home(){
  var c=counts();
  var h='<div class="head"><h1>OPIc 스크립트</h1><span class="status" id="status"></span></div>'
   +'<p class="mute">이야기 재료를 모으고 영어 답변 틀로 쌓습니다. 시험관 역할은 Claude와의 대화에서 합니다.</p>'
   +msgHtml()+nextCard()
   +'<section class="card"><h2>지금까지</h2><div class="nums"><span><b>'+c.st+'</b>이야기</span><span><b>'+c.fr+'</b>답변 틀</span><span><b>'+c.pct+'%</b>채움</span></div></section>'
   +'<div class="row between"><h2>주제</h2><span class="mute small">★ 시험 주제로 고르면 먼저 채웁니다</span></div>';
  topics().forEach(function(t){
    var d=tdoc(t.id),f=Math.round(fill(t)*100);
    h+='<div class="topic" tabindex="0" role="button" data-act="go" data-id="'+t.id+'">'
     +'<div class="row between"><h3>'+esc(t.name)+'</h3><span class="row"><span class="mute small">이야기 '+d.stories.length+' · 틀 '+d.frames.length+'</span>'
     +'<button class="star'+(isFocus(t.id)?" on":"")+'" data-act="focus" data-id="'+t.id+'" aria-label="시험 주제로 고르기">'+(isFocus(t.id)?"★":"☆")+'</button></span></div>'
     +'<div class="bar"><i style="width:'+f+'%"></i></div><div class="chips">'+kindChips(t)+'</div></div>';
  });
  h+='<section class="card"><h3>주제 추가</h3><div class="row"><input type="text" id="new-topic" class="grow" placeholder="예: 쇼핑" data-bind="newTopic"><button class="ghost" data-act="topicAdd">추가</button></div></section>'
   +'<section class="card"><h3>내보내기</h3><div class="row"><label class="chk"><input type="checkbox" data-bind="exp.stories"'+(S.exp.stories?" checked":"")+'>한국어 이야기 재료 포함</label>'
   +'<label class="chk"><input type="checkbox" data-bind="exp.sens"'+(S.exp.sens?" checked":"")+'>개인적·민감 표시 항목 포함</label></div>'
   +'<div><button class="ghost" data-act="export">.md로 저장</button></div></section>'
   +'<section class="card"><h3>목표 등급</h3><p class="mute small">영어 답변 틀을 만들 때의 기준입니다. 이미 만든 틀은 바뀌지 않습니다.</p>'
   +'<div><select data-bind="level" aria-label="목표 등급"><option value="AL"'+(meta().level!=="IH"?" selected":"")+'>AL (Advanced Low)</option><option value="IH"'+(meta().level==="IH"?" selected":"")+'>IH (Intermediate High)</option></select></div></section>'
   +'<section class="card"><h3>소유자 설명</h3><p class="mute small">AI에게 넘기는 한 줄 설명입니다. 예: 직업, 영어 수준, 목표.</p>'
   +'<textarea rows="2" data-bind="about">'+esc(meta().about||"")+'</textarea></section>';
  return h;
}
function storyHtml(t,s){
  var ed=S.edit===s.id;
  var h='<div class="card"><div class="row between"><div class="row"><span class="pill">'+KIND[s.kind]+'</span>'+(s.sens?'<span class="pill sens">개인적</span>':"")+'<h3>'+esc(s.title||"")+'</h3></div></div>';
  if(ed){
    h+='<input type="text" data-bind="editS.title" value="'+esc(S.editS.title)+'" aria-label="제목"><textarea rows="6" data-bind="editS.text">'+esc(S.editS.text)+'</textarea>'
     +'<div class="row"><button data-act="storySave" data-id="'+s.id+'">저장</button><button class="ghost" data-act="storyCancel">취소</button></div>';
  }else{
    h+='<p class="small" style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(s.text)+'</p>'
     +'<div class="row"><select data-chg="storyKind" data-id="'+s.id+'" aria-label="유형">'+kindOpts(s.kind)+'</select>'
     +'<button class="ghost" data-act="frameFrom" data-id="'+s.id+'"'+(S.busy?" disabled":"")+'>'+(S.busy==="f"+s.id?"만드는 중…":"영어 틀 만들기")+'</button>'
     +'<button class="link" data-act="storyEdit" data-id="'+s.id+'">편집</button>'
     +'<button class="link" data-act="storySens" data-id="'+s.id+'">'+(s.sens?"개인적 표시 해제":"개인적 표시")+'</button>'
     +'<button class="link danger" data-act="storyDel" data-id="'+s.id+'">삭제</button></div>';
  }
  return h+'</div>';
}
function frameHtml(t,f){
  var ed=S.edit==="f"+f.id;
  var h='<div class="card"><div class="row between"><span class="row"><span class="pill">'+KIND[f.kind]+'</span>'+(f.level?'<span class="pill">'+f.level+'</span>':"")+'</span><span class="row"><button class="link" data-act="frameCopy" data-id="'+f.id+'">복사</button><button class="link" data-act="frameEdit" data-id="'+f.id+'">'+(ed?"완료":"편집")+'</button><button class="link danger" data-act="frameDel" data-id="'+f.id+'">삭제</button></span></div>'
   +'<p class="q">'+esc(f.q)+'</p>';
  if(ed)h+='<textarea rows="10" data-bind="frameEn" data-id="'+f.id+'">'+esc(f.en)+'</textarea>';
  else h+='<div class="en">'+esc(f.en)+'</div>';
  if(f.expr&&f.expr.length)h+='<div class="expr">'+f.expr.map(function(x){return '<div><b>'+esc(x.en)+'</b></div><div class="mute">'+esc(x.ko)+'</div>'}).join("")+'</div>';
  if(f.tip)h+='<p class="tip">'+esc(f.tip)+'</p>';
  return h+'</div>';
}
function topicView(id){
  var t=topicBy(id);if(!t){S.view="home";return home()}
  var d=tdoc(id),b=S.busy;
  var h='<div class="head"><div class="row"><button class="ghost" data-act="go" data-id="home">← 목록</button><h1>'+esc(t.name)+'</h1></div><span class="status" id="status"></span></div>'
   +'<div class="row between"><div class="chips">'+kindChips(t)+'</div><button class="star'+(isFocus(id)?" on":"")+'" data-act="focus" data-id="'+id+'">'+(isFocus(id)?"★ 시험 주제":"☆ 시험 주제로")+'</button></div>'
   +msgHtml()
   +'<section class="card"><h2>이야기 더하기</h2>'
   +'<div class="row"><select data-bind="form.kind" aria-label="유형">'+kindOpts(S.form.kind,need(t).concat(KINDS.map(function(k){return k[0]}).filter(function(k){return need(t).indexOf(k)<0})))+'</select>'
   +'<button class="ghost" data-act="ask"'+(b?" disabled":"")+'>'+(b==="ask"?"질문 만드는 중…":"이 유형 질문 받기")+'</button></div>'
   +(S.draft.topic===id&&S.draft.q?'<p class="q">'+esc(S.draft.q)+'</p>':"")
   +'<input type="text" id="f-title" data-bind="form.title" placeholder="제목 (선택)" value="'+esc(S.form.title)+'">'
   +'<textarea id="f-text" rows="5" data-bind="form.text" placeholder="한국어로 적어 주세요.">'+esc(S.form.text)+'</textarea>'
   +'<div class="row"><label class="chk"><input type="checkbox" data-bind="form.sens"'+(S.form.sens?" checked":"")+'>개인적·민감</label><button data-act="storyAdd">저장</button></div></section>'
   +'<h2>이야기 '+d.stories.length+'</h2>'
   +(d.stories.length?d.stories.map(function(s){return storyHtml(t,s)}).join(""):'<p class="mute small">아직 없습니다. 위에서 질문을 받아 하나 적어 보세요.</p>')
   +'<div class="row between"><h2>답변 틀 '+d.frames.length+'</h2><span class="row">'
   +KINDS.filter(function(k){return d.stories.some(function(s){return s.kind===k[0]})}).map(function(k){return '<button class="ghost" data-act="frameKind" data-id="'+k[0]+'"'+(b?" disabled":"")+'>'+(b==="k"+k[0]?"만드는 중…":KIND[k[0]]+" 틀")+'</button>'}).join("")+'</span></div>'
   +(d.frames.length?d.frames.map(function(f){return frameHtml(t,f)}).join(""):'<p class="mute small">이야기를 저장한 뒤 "영어 틀 만들기"를 누르면 여기에 쌓입니다.</p>');
  return h;
}
function render(){
  var y=window.scrollY;
  $("#app").innerHTML=S.view==="home"?home():topicView(S.view);
  paintStatus();
  window.scrollTo(0,y);
}
function note(m,bad){S.msg=m||"";S.msgBad=!!bad}

/* ---------- 동작 ---------- */
function setPath(path,v){
  var p=path.split("."),o=S;
  for(var i=0;i<p.length-1;i++){if(!o[p[i]]||typeof o[p[i]]!=="object")o[p[i]]={};o=o[p[i]]}
  o[p[p.length-1]]=v;
}
function addStory(tid,kind,title,text,sens){
  var d=tdoc(tid);
  d.stories.unshift({id:nid(),kind:kind,title:String(title||"").trim(),text:String(text).trim(),sens:!!sens,at:new Date().toISOString()});
  persist("st_"+tid);
}
function frameOf(tid,fid){return tdoc(tid).frames.filter(function(f){return f.id===fid})[0]}
function storyOf(tid,sid){return tdoc(tid).stories.filter(function(s){return s.id===sid})[0]}
function run(key,fn){
  S.busy=key;note("");render();
  return fn().then(function(){S.busy="";render()}).catch(function(e){S.busy="";note(e&&e.code==="no_story"?e.message:aiErr(e),true);render()});
}
function mdExport(){
  var L=["# OPIc 스크립트","",new Date().toISOString().slice(0,10),""];
  topics().forEach(function(t){
    var d=tdoc(t.id),st=d.stories.filter(function(s){return S.exp.sens||!s.sens}),fr=d.frames;
    if(!st.length&&!fr.length)return;
    L.push("## "+t.name,"");
    fr.forEach(function(f){
      L.push("### "+KIND[f.kind],"","**Q.** "+f.q,"",f.en,"");
      (f.expr||[]).forEach(function(x){L.push("- "+x.en+" — "+x.ko)});
      if(f.tip)L.push("","> "+f.tip);
      L.push("");
    });
    if(S.exp.stories&&st.length){L.push("### 이야기 재료","");st.forEach(function(s){L.push("- ["+KIND[s.kind]+"] "+(s.title?s.title+": ":"")+s.text.replace(/\s+/g," "))});L.push("")}
  });
  return L.join("\n");
}
var ACT={
  go:function(el){S.view=el.dataset.id;note("");S.edit="";location.hash=S.view==="home"?"":S.view;render();window.scrollTo(0,0)},
  focus:function(el,ev){ev.stopPropagation();var m=meta(),id=el.dataset.id,i=m.focus.indexOf(id);if(i>=0)m.focus.splice(i,1);else m.focus.push(id);persist("meta");render()},
  nextAsk:function(){var n=pickNext();if(!n)return;run("ask",function(){return askQuestion(n.t,n.kind).then(function(q){S.draft={topic:n.t.id,kind:n.kind,q:q,text:S.draft.text||""}})})},
  nextSave:function(){
    var n=pickNext();if(!n)return;var tx=(S.draft.text||"").trim();
    if(!tx){note("내용을 적어 주세요.",true);render();return}
    addStory(n.t.id,n.kind,"",tx,false);S.draft={};note("저장했습니다.");render();
  },
  nextBuild:function(){var n=pickNext();if(!n)return;run("build",function(){return buildFrame(n.t,n.kind)})},
  topicAdd:function(){var v=(S.newTopic||"").trim();if(!v)return;var m=meta();m.custom.push({id:"c"+nid(),name:v});S.newTopic="";persist("meta");render()},
  ask:function(){var t=topicBy(S.view),k=S.form.kind;run("ask",function(){return askQuestion(t,k).then(function(q){S.draft={topic:t.id,kind:k,q:q}})})},
  storyAdd:function(){
    var f=S.form;if(!(f.text||"").trim()){note("내용을 적어 주세요.",true);render();return}
    addStory(S.view,f.kind,f.title,f.text,f.sens);S.form={kind:f.kind,title:"",text:"",sens:false};S.draft={};note("저장했습니다.");render();
  },
  storyEdit:function(el){var s=storyOf(S.view,el.dataset.id);S.edit=s.id;S.editS={title:s.title||"",text:s.text};render()},
  storyCancel:function(){S.edit="";render()},
  storySave:function(el){var s=storyOf(S.view,el.dataset.id);s.title=S.editS.title.trim();s.text=S.editS.text.trim();s.up=new Date().toISOString();S.edit="";persist("st_"+S.view);render()},
  storySens:function(el){var s=storyOf(S.view,el.dataset.id);s.sens=!s.sens;persist("st_"+S.view);render()},
  storyDel:function(el){var d=tdoc(S.view);d.stories=d.stories.filter(function(s){return s.id!==el.dataset.id});persist("st_"+S.view);render()},
  frameFrom:function(el){var t=topicBy(S.view),s=storyOf(t.id,el.dataset.id);run("f"+s.id,function(){return buildFrame(t,s.kind,[s.id])})},
  frameKind:function(el){var t=topicBy(S.view),k=el.dataset.id;run("k"+k,function(){return buildFrame(t,k)})},
  frameDel:function(el){var d=tdoc(S.view);d.frames=d.frames.filter(function(f){return f.id!==el.dataset.id});persist("st_"+S.view);render()},
  frameEdit:function(el){var id="f"+el.dataset.id;if(S.edit===id){S.edit="";persist("st_"+S.view)}else S.edit=id;render()},
  frameCopy:function(el){
    var f=frameOf(S.view,el.dataset.id),txt=f.q+"\n\n"+f.en;
    var done=function(ok){note(ok?"복사했습니다.":"복사하지 못했습니다. 직접 선택해서 복사해 주세요.",!ok);render()};
    try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
  },
  export:function(){
    if(!B.dl){note("이 환경에서는 파일 저장을 쓸 수 없습니다.",true);render();return}
    B.dl.save({filename:"opic-scripts.md",data:new Blob([mdExport()],{type:"text/markdown"})}).then(function(){note("저장했습니다.");render()}).catch(function(e){if(e&&e.code!=="declined"){note("저장하지 못했습니다 ("+(e&&e.code||"오류")+")",true);render()}});
  }
};
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  if(el.tagName==="BUTTON"&&el.disabled)return;
  var f=ACT[el.dataset.act];if(f)f(el,ev);
});
document.addEventListener("keydown",function(ev){
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("topic")){ev.preventDefault();ACT.go(ev.target,ev)}
});
document.addEventListener("input",function(ev){
  var el=ev.target,p=el.dataset&&el.dataset.bind;if(!p)return;
  if(p==="frameEn"){var f=frameOf(S.view,el.dataset.id);if(f)f.en=el.value;return}
  if(p==="about"){meta().about=el.value;return}
  if(p==="level")return;
  setPath(p,el.type==="checkbox"?el.checked:el.value);
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.bind==="about"){persist("meta");return}
  if(el.dataset&&el.dataset.bind==="level"){meta().level=el.value;persist("meta");return}
  if(el.dataset&&el.dataset.bind&&el.dataset.bind.indexOf("exp.")===0){setPath(el.dataset.bind,el.checked);return}
  if(el.dataset&&el.dataset.bind==="form.sens"){S.form.sens=el.checked;return}
  if(el.dataset&&el.dataset.chg==="storyKind"){var s=storyOf(S.view,el.dataset.id);s.kind=el.value;persist("st_"+S.view);render()}
});
window.addEventListener("hashchange",function(){var h=location.hash.replace("#","");S.view=h&&topicBy(h)?h:"home";render()});

/* ---------- 시작 ---------- */
B.init().then(function(){return B.loadAll()}).catch(function(){return {}}).then(function(docs){
  S.docs=docs||{};
  var h=location.hash.replace("#","");if(h&&topicBy(h))S.view=h;
  S.save=B.kind==="cloud"?"":"계정에 연결되지 않았습니다";
  render();
});
})();
</script>
