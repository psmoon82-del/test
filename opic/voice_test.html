<title>OPIc 음성 시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Batang:wght@700&display=swap">
<style>
/* 한 화면짜리 점검 도구: 위에서 아래로 항목 4개, 각 항목은 버튼 하나와 결과 한 줄 */
:root{
  --bg:#eef1ee; --card:#f8faf8; --ink:#25303a; --mute:#5d6a74; --line:#cfd7d2;
  --accent:#1f6f6b; --accent-ink:#ffffff; --ok:#2f7d4f; --warn:#9a6a14; --bad:#a23b3b;
  --f-head:"Gowun Batang",Georgia,serif; --f-body:"IBM Plex Sans KR",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171d21; --card:#1f272c; --ink:#e3e8e5; --mute:#97a4ab; --line:#33403f;
  --accent:#4fb3ac; --accent-ink:#0f1a1a; --ok:#6ec58f; --warn:#d9a94a; --bad:#e08585; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171d21; --card:#1f272c; --ink:#e3e8e5; --mute:#97a4ab; --line:#33403f;
  --accent:#4fb3ac; --accent-ink:#0f1a1a; --ok:#6ec58f; --warn:#d9a94a; --bad:#e08585; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);padding-inline:16px;padding-block:24px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:700 26px/1.3 var(--f-head);margin:0;text-wrap:balance}
p{margin:0;color:var(--mute)}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font:600 16px/1.4 var(--f-body);margin:0}
button,select,textarea{font:inherit;color:var(--ink)}
button{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:500}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;box-sizing:border-box}
.res{font:13px/1.5 var(--f-mono);color:var(--mute);overflow-wrap:anywhere}
.res b{font-weight:500}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
</style>
<main>
  <h1>OPIc 음성 시험</h1>
  <p>이 Artifact 안에서 질문 음성과 말하기 입력이 되는지 확인합니다. 항목마다 버튼을 누르고 결과 줄을 알려 주세요.</p>

  <section>
    <h2>1. 질문 음성 (영어)</h2>
    <select id="voice" aria-label="영어 음성 선택"></select>
    <button id="btn-tts" type="button">Eva 질문 들어 보기</button>
    <div class="res" id="res-tts">아직 확인 전</div>
  </section>

  <section>
    <h2>2. 음성 인식</h2>
    <button id="btn-stt" type="button">말하기 시작</button>
    <textarea id="stt-out" rows="3" placeholder="인식된 글이 여기에 나옵니다"></textarea>
    <div class="res" id="res-stt">아직 확인 전</div>
  </section>

  <section>
    <h2>3. 마이크 접근</h2>
    <button id="btn-mic" type="button">마이크 확인</button>
    <div class="res" id="res-mic">아직 확인 전</div>
  </section>

  <section>
    <h2>4. 환경</h2>
    <div class="res" id="res-env"></div>
  </section>
</main>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
function show(id,cls,msg){var el=$(id);el.innerHTML='<b class="'+cls+'">'+msg+'</b>'}

/* 환경 */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("res-env").textContent=[
  "speechSynthesis: "+("speechSynthesis" in window?"있음":"없음"),
  "SpeechRecognition: "+(SR?"있음":"없음"),
  "mediaDevices: "+(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?"있음":"없음"),
  "브라우저: "+navigator.userAgent.replace(/\s*\(.*?\)\s*/g," ").slice(0,90)
].join("\n");
$("res-env").style.whiteSpace="pre-wrap";

/* 1. 질문 음성 */
var voices=[];
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  voices=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)});
  var sel=$("voice");sel.innerHTML="";
  voices.forEach(function(v,i){var o=document.createElement("option");o.value=i;o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o)});
  if(!voices.length){var o=document.createElement("option");o.textContent="영어 음성 없음";sel.appendChild(o)}
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
$("btn-tts").addEventListener("click",function(){
  if(!("speechSynthesis" in window)){show("res-tts","bad","이 환경에는 질문 음성 기능이 없습니다.");return}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance("Hello. Please tell me about the place where you live. What does it look like, and what do you like about it?");
    var v=voices[$("voice").value];if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
    u.onstart=function(){show("res-tts","ok","재생 시작 (소리가 들리면 성공)")};
    u.onend=function(){show("res-tts","ok","재생 끝까지 완료. 소리가 들렸다면 성공")};
    u.onerror=function(e){show("res-tts","bad","오류: "+(e.error||"알 수 없음"))};
    speechSynthesis.speak(u);
    setTimeout(function(){if(!speechSynthesis.speaking&&!speechSynthesis.pending&&$("res-tts").textContent==="아직 확인 전")show("res-tts","warn","재생이 시작되지 않았습니다.")},1500);
  }catch(e){show("res-tts","bad","오류: "+e.message)}
});

/* 2. 음성 인식 */
var rec=null;
$("btn-stt").addEventListener("click",function(){
  if(!SR){show("res-stt","bad","이 환경에는 음성 인식 기능이 없습니다. 타이핑으로 갑니다.");return}
  if(rec){rec.stop();return}
  try{
    rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=false;
    rec.onstart=function(){$("btn-stt").textContent="멈추기";show("res-stt","ok","듣는 중. 영어로 한두 문장 말해 보세요.")};
    rec.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;$("stt-out").value=t;show("res-stt","ok","인식됨")};
    rec.onerror=function(e){show("res-stt","bad","오류: "+e.error)};
    rec.onend=function(){$("btn-stt").textContent="말하기 시작";rec=null};
    rec.start();
  }catch(e){rec=null;show("res-stt","bad","오류: "+e.message)}
});

/* 3. 마이크 */
$("btn-mic").addEventListener("click",function(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){show("res-mic","bad","이 환경에는 마이크 접근 기능이 없습니다.");return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    s.getTracks().forEach(function(t){t.stop()});show("res-mic","ok","마이크 허용됨");
  }).catch(function(e){show("res-mic","bad","거부됨: "+(e.name||"")+" "+(e.message||""))});
});
})();
</script>
